<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Teams</title>
    <style>
        :root {
            --bg: #0e1726;
            --card: #152238;
            --text: #eef2ff;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, system-ui, sans-serif;
            background: radial-gradient(circle at top, rgba(59,130,246,0.18), transparent 30%),
                        linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
            color: var(--text);
        }
        .login-card {
            width: min(420px, calc(100vw - 32px));
            padding: 32px;
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.88);
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.35);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand h1 {
            margin: 0;
            font-size: 1.75rem;
            letter-spacing: 0.08em;
        }
        .brand p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
        form {
            display: grid;
            gap: 18px;
        }
        .field {
            display: grid;
            gap: 8px;
        }
        label {
            font-size: 0.95rem;
            color: var(--muted);
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: rgba(59,130,246,0.55);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .actions .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.92rem;
        }
        .actions a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.92rem;
        }
        button {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background: var(--accent-hover);
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .footer a {
            color: var(--text);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <section class="brand">
            <h1>My Teams</h1>
            <p>Masuk untuk melanjutkan ke dashboard tim Anda.</p>
        </section>
        <form id="loginForm" action="#" method="post" onsubmit="return handleLogin(event)">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="actions">
                <label class="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Ingat saya
                </label>
                <a href="#">Lupa password?</a>
            </div>
            <button type="submit">Masuk</button>
        </form>
        <p class="footer">Belum punya akun? <a href="index.html">Daftar sekarang</a></p>
    </main>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) {
                alert('Silakan isi email dan password.');
                return false;
            }
            alert('Login berhasil! Selamat datang, ' + email + '.');
            return false;
        }
    </script>
</body>
</html>
